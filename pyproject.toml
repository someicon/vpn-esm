[project]
name = "vless-reality"
version = "0.1.0"
description = "One VPS, VLESS+Reality, a local CLI, and Telegram. No nginx, Docker, or panel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "vless-reality"}]
dependencies = [
    "cryptography>=43",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vless-reality = "vless_reality.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
